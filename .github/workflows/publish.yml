name: Build and publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Destination (prepare only builds and stages the jars)
        type: choice
        options: [prepare, modrinth, curseforge, all]
        default: prepare
        required: true
      loader:
        description: Loader to publish
        type: choice
        options: [all, fabric, neoforge]
        default: all
        required: true
      channel:
        description: Release channel for uploaded files
        type: choice
        options: [alpha, beta, release]
        default: beta
        required: true

permissions:
  contents: read

concurrency:
  group: temper-and-tang-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - name: Read the release version
        id: version
        shell: python
        run: |
          import os, re
          from pathlib import Path

          version = re.search(r"^mod_version=(.+)$", Path("gradle.properties").read_text(), re.M)[1].strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", version):
              raise SystemExit(f"Invalid mod_version: {version}")
          notes = Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          if notes.splitlines()[:1] != [f"# Temper & Tang {version}"]:
              raise SystemExit(f"Update RELEASE_NOTES.md for {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"value={version}\n")
      - name: Build, test, and verify both jars
        run: |
          chmod +x gradlew scripts/build.sh
          scripts/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: temper-and-tang-release
          path: build/release/
          if-no-files-found: error

  publish:
    if: inputs.target != 'prepare'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: ${{ fromJSON(inputs.loader == 'all' && '["fabric","neoforge"]' || format('["{0}"]', inputs.loader)) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: temper-and-tang-release
          path: build/release
      - name: Check credentials and prepared artifact
        env:
          TARGET: ${{ inputs.target }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          LOADER: ${{ matrix.loader }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$TARGET" != curseforge && -z "$MODRINTH_TOKEN" ]]; then
            echo "::error::Set the MODRINTH_TOKEN repository secret."
            exit 1
          fi
          if [[ "$TARGET" != modrinth && -z "$CURSEFORGE_TOKEN" ]]; then
            echo "::error::Set the CURSEFORGE_TOKEN repository secret."
            exit 1
          fi
          cd build/release
          sha256sum --check SHA256SUMS.txt
          test -s "TemperAndTang-$VERSION-$LOADER-1.21.1.jar"
      - name: Publish ${{ matrix.loader }} for Minecraft 1.21.1
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          modrinth-id: ${{ inputs.target != 'curseforge' && 'temper-and-tang' || '' }}
          modrinth-token: ${{ inputs.target != 'curseforge' && secrets.MODRINTH_TOKEN || '' }}
          curseforge-id: ${{ inputs.target != 'modrinth' && '1834462' || '' }}
          curseforge-token: ${{ inputs.target != 'modrinth' && secrets.CURSEFORGE_TOKEN || '' }}
          name: Temper & Tang ${{ needs.build.outputs.version }} (${{ matrix.loader }})
          version: ${{ needs.build.outputs.version }}-${{ matrix.loader }}
          version-type: ${{ inputs.channel }}
          files: build/release/TemperAndTang-${{ needs.build.outputs.version }}-${{ matrix.loader }}-1.21.1.jar
          changelog-file: build/release/RELEASE_NOTES.md
          loaders: ${{ matrix.loader }}
          game-versions: '1.21.1'
          java: '21'
          dependencies: |
            diegesis(required){modrinth:diegesis-api}{curseforge:diegesis}
            fzzy-config(required){modrinth:fzzy-config}{curseforge:fzzy-config}
            ${{ matrix.loader == 'fabric' && 'fabric-api(required){modrinth:fabric-api}{curseforge:fabric-api}' || 'kotlin-for-forge(required){modrinth:kotlin-for-forge}{curseforge:kotlin-for-forge}' }}
            ${{ matrix.loader == 'fabric' && 'fabric-language-kotlin(required){modrinth:fabric-language-kotlin}{curseforge:fabric-language-kotlin}' || '' }}
          fail-mode: fail
