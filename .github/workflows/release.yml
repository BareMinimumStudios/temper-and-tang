name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version, for example 0.1.0'
        required: true
      publish_github_draft:
        description: 'Create a draft GitHub release (no Modrinth upload)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 -c 'import os,re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", os.environ["RELEASE_VERSION"])'
      - name: Build release files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          chmod +x gradlew scripts/build.sh
          scripts/build.sh "-Pmod_version=$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: build/release/
      - name: Create optional draft
        if: inputs.publish_github_draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v$RELEASE_VERSION" build/release/* --draft --target "$GITHUB_SHA" --title "Temper & Tang $RELEASE_VERSION" --notes-file RELEASE_NOTES.md
